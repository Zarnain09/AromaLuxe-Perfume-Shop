<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop – AromaLuxe</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<div class="container py-5">
  <h2 class="section-title">Shop All Perfumes</h2>
  <div class="row g-4">
    <div class="col-lg-3">
      <div class="filter-card mb-4">
        <h6 class="fw-bold mb-3">Search</h6>
        <input type="text" id="searchBox" class="form-control mb-4" placeholder="Search perfumes...">

        <h6 class="fw-bold mb-3">Category</h6>
        <div class="form-check"><input class="form-check-input cat-filter" type="checkbox" value="Men" id="catMen"><label class="form-check-label" for="catMen">Men</label></div>
        <div class="form-check"><input class="form-check-input cat-filter" type="checkbox" value="Women" id="catWomen"><label class="form-check-label" for="catWomen">Women</label></div>
        <div class="form-check mb-4"><input class="form-check-input cat-filter" type="checkbox" value="Unisex" id="catUnisex"><label class="form-check-label" for="catUnisex">Unisex</label></div>

        <h6 class="fw-bold mb-3">Sort By</h6>
        <select id="sortSelect" class="form-select">
          <option value="default">Featured</option>
          <option value="priceLow">Price: Low to High</option>
          <option value="priceHigh">Price: High to Low</option>
          <option value="nameAZ">Name: A–Z</option>
        </select>
      </div>
    </div>
    <div class="col-lg-9">
      <div class="row g-4" id="productGrid"></div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
function renderGrid() {
  let list = getProducts();
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  const checked = Array.from(document.querySelectorAll(".cat-filter:checked")).map(c => c.value);
  const sort = document.getElementById("sortSelect").value;

  if (q) list = list.filter(p => p.name.toLowerCase().includes(q) || p.family.toLowerCase().includes(q));
  if (checked.length) list = list.filter(p => checked.includes(p.category));
  if (sort === "priceLow") list.sort((a,b) => a.price - b.price);
  if (sort === "priceHigh") list.sort((a,b) => b.price - a.price);
  if (sort === "nameAZ") list.sort((a,b) => a.name.localeCompare(b.name));

  const grid = document.getElementById("productGrid");
  if (!list.length) { grid.innerHTML = `<p class="text-muted">No perfumes match your filters.</p>`; return; }

  grid.innerHTML = list.map(p => `
    <div class="col-sm-6 col-md-4">
      <div class="product-card position-relative">
        <div class="wish-btn ${isWishlisted(p.id) ? "active" : ""}" data-id="${p.id}">♡</div>
        <a href="product.html?id=${p.id}" class="text-decoration-none text-dark">
          ${bottleSwatch(p)}
          <div class="p-3">
            <span class="badge badge-cat mb-2">${p.category} · ${p.family}</span>
            <h6 class="mb-1">${p.name}</h6>
            <div class="price-tag">$${p.price}</div>
          </div>
        </a>
        <div class="px-3 pb-3">
          <button class="btn btn-gold btn-sm w-100 add-cart-btn" data-id="${p.id}">Add to Cart</button>
        </div>
      </div>
    </div>`).join("");

  grid.querySelectorAll(".add-cart-btn").forEach(btn => btn.addEventListener("click", (e) => {
    addToCart(e.target.dataset.id, 1);
    document.getElementById("cartBadge").textContent = cartCount();
    e.target.textContent = "Added ✓";
    setTimeout(() => e.target.textContent = "Add to Cart", 900);
  }));
  grid.querySelectorAll(".wish-btn").forEach(btn => btn.addEventListener("click", () => {
    const active = toggleWishlist(btn.dataset.id);
    btn.classList.toggle("active", active);
  }));
}

document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(location.search);
  const cat = params.get("cat");
  if (cat) { const box = document.getElementById("cat" + cat); if (box) box.checked = true; }

  renderGrid();
  document.getElementById("searchBox").addEventListener("input", renderGrid);
  document.getElementById("sortSelect").addEventListener("change", renderGrid);
  document.querySelectorAll(".cat-filter").forEach(c => c.addEventListener("change", renderGrid));
});
</script>
</body>
</html>
