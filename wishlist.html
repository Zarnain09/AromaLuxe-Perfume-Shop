<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist – AromaLuxe</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<div class="container py-5">
  <h2 class="section-title">Your Wishlist</h2>
  <div class="row g-4" id="wishGrid"></div>
</div>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
function renderWishlist() {
  const ids = getWishlist();
  const grid = document.getElementById("wishGrid");
  if (!ids.length) { grid.innerHTML = `<p class="text-muted">No items saved yet. <a href="shop.html">Browse perfumes</a>.</p>`; return; }
  grid.innerHTML = ids.map(id => {
    const p = getProduct(id);
    if (!p) return "";
    return `
    <div class="col-sm-6 col-md-3">
      <div class="product-card position-relative">
        <div class="wish-btn active" data-id="${p.id}">♥</div>
        <a href="product.html?id=${p.id}" class="text-decoration-none text-dark">
          ${bottleSwatch(p)}
          <div class="p-3"><h6 class="mb-1">${p.name}</h6><div class="price-tag">$${p.price}</div></div>
        </a>
      </div>
    </div>`;
  }).join("");
  grid.querySelectorAll(".wish-btn").forEach(btn => btn.addEventListener("click", () => {
    toggleWishlist(btn.dataset.id);
    renderWishlist();
  }));
}
document.addEventListener("DOMContentLoaded", renderWishlist);
</script>
</body>
</html>
